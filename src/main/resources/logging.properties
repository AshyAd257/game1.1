# JME3 日志配置 - 减少冗余输出
# 只显示重要的错误和我们的调试信息

# 全局日志级别：只显示警告和错误
.level=WARNING

# 禁用 GLTF 加载器的插值警告
com.jme3.scene.plugins.gltf.GltfLoader.level=SEVERE

# 禁用 InputManager 的映射警告
com.jme3.input.InputManager.level=SEVERE

# 禁用 SkinningControl 的信息输出
com.jme3.anim.SkinningControl.level=WARNING

# 启用我们的调试输出
com.Hecate.player.SkeletalPlayerController.level=INFO
com.Hecate.player.PuppetBoneAttachment.level=INFO
com.Hecate.player.PuppetBoneAttachmentManager.level=INFO

# 禁用纹理警告（暂时）
com.Hecate.utils.LogUtils.level=SEVERE
